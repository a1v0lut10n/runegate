---
- name: Install Redis server
  apt:
    name: redis-server
    state: present

- name: Ensure Redis is started and enabled
  service:
    name: redis-server
    state: started
    enabled: yes

- name: Configure Redis to bind to localhost
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^bind '
    line: 'bind 127.0.0.1'
  notify: Restart Redis
